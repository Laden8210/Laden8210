name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E8A33D&color_dots=#ebedf0,#c6e2ea,#7FB8C9,#3f6f8a,#1B2F4B
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E8A33D&color_dots=#161b22,#1B2F4B,#3f6f8a,#7FB8C9,#c6e2ea

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
